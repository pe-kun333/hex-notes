<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>計測層（開発）</title>
    <style>
      :root {
        --bg: #111318;
        --fg: #e8e9ec;
        --dim: #8a8f99;
        --line: #2a2e37;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.5 system-ui,
          sans-serif;
      }
      main {
        padding: 16px;
        max-width: 1200px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      p.note {
        color: var(--dim);
        margin: 0 0 12px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        align-items: center;
        margin: 8px 0;
      }
      table {
        border-collapse: collapse;
        margin: 8px 0 12px;
        width: 100%;
      }
      th,
      td {
        border: 1px solid var(--line);
        padding: 4px 8px;
        text-align: left;
        font-variant-numeric: tabular-nums;
        vertical-align: top;
      }
      th {
        color: var(--dim);
        font-weight: 500;
      }
      td.json {
        font:
          12px/1.4 ui-monospace,
          monospace;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>計測層（手順 12）</h1>
      <p class="note">
        IndexedDB の telemetry（リング 1,000 行）に貯まった §4.6 の行を見て、JSON
        で書き出す開発用のページ（製品画面ではない。計測盤は
        M1-12）。行は「描画層・判定層」の開発ページで 1 曲遊ぶと play 行と calib 行、開くと device
        行が足される。初版は送信しない。
      </p>
      <div class="controls">
        <button id="reload" type="button">読み直す</button>
        <button id="export" type="button">JSON で書き出す</button>
        <button id="clear" type="button">telemetry を空にする</button>
        <span id="mode"></span>
      </div>
      <p class="note" id="counts"></p>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>at</th>
            <th>kind</th>
            <th>中身</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </main>
    <script type="module" src="./telemetry-dev.ts"></script>
  </body>
</html>
