<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>描画層（開発）</title>
    <style>
      :root {
        --bg: #0b0d12;
        --fg: #e8e9ec;
        --dim: #8a8f99;
        --line: #2a2e37;
        --panel: #151821;
        --band: #3a2f12;
        --band-fg: #f3d27a;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font:
          13px/1.45 system-ui,
          sans-serif;
      }
      #player {
        position: absolute;
        border: 1px dashed var(--line);
        border-radius: 6px;
        display: grid;
        place-items: center;
        color: var(--dim);
        box-sizing: border-box;
      }
      #panel {
        position: absolute;
        overflow: auto;
        box-sizing: border-box;
        padding: 10px 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      #stage {
        position: absolute;
        outline: none;
        border-radius: 4px;
      }
      #stage:focus-visible {
        box-shadow: 0 0 0 1px #3b4250;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 6px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
        margin: 6px 0;
      }
      label {
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      select,
      button {
        font: inherit;
        color: var(--fg);
        background: #1f2330;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 2px 6px;
      }
      .note {
        color: var(--dim);
        margin: 4px 0;
      }
      .band {
        background: var(--band);
        color: var(--band-fg);
        padding: 4px 8px;
        border-radius: 4px;
        margin: 6px 0;
      }
      .band[hidden] {
        display: none;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 2px 4px;
        text-align: right;
        white-space: nowrap;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      textarea {
        width: 100%;
        height: 90px;
        box-sizing: border-box;
        font:
          11px/1.35 ui-monospace,
          monospace;
        background: #0f1117;
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 4px;
      }
      ol {
        margin: 4px 0;
        padding-left: 18px;
      }
    </style>
  </head>
  <body>
    <div id="player">プレイヤー矩形（480×270。動画は置かない）</div>
    <div id="panel"></div>
    <canvas id="stage" tabindex="0" aria-label="落下域と鍵盤図"></canvas>
    <script type="module" src="./play-dev.ts"></script>
  </body>
</html>
