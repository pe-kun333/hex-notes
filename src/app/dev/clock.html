<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>時計層（開発）</title>
    <style>
      :root {
        --bg: #0b0d12;
        --fg: #e8e9ec;
        --dim: #8a8f99;
        --line: #2a2e37;
        --panel: #151821;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          13px/1.45 system-ui,
          sans-serif;
      }
      main {
        display: grid;
        grid-template-columns: minmax(320px, 420px) 1fr;
        gap: 12px;
        padding: 12px;
        box-sizing: border-box;
        min-height: 100vh;
      }
      #panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px 12px;
        overflow: auto;
      }
      #right {
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 8px;
        min-width: 0;
      }
      #graph {
        width: 100%;
        height: 360px;
        background: #0f1117;
        border: 1px solid var(--line);
        border-radius: 6px;
        outline: none;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 6px;
      }
      h2 {
        font-size: 13px;
        margin: 10px 0 4px;
        color: var(--dim);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 8px;
        align-items: center;
        margin: 6px 0;
      }
      label {
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      select,
      button {
        font: inherit;
        color: var(--fg);
        background: #1f2330;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 2px 6px;
      }
      button:disabled {
        opacity: 0.45;
      }
      .note {
        color: var(--dim);
        margin: 4px 0;
      }
      #readout {
        font:
          12px/1.5 ui-monospace,
          monospace;
        white-space: pre;
        background: #0f1117;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 8px;
      }
      #log {
        font:
          12px/1.45 ui-monospace,
          monospace;
        margin: 0;
        padding-left: 18px;
        max-height: 260px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="panel"></div>
      <div id="right">
        <div id="readout"></div>
        <canvas id="graph" tabindex="0" aria-label="残差のグラフ"></canvas>
      </div>
    </main>
    <script type="module" src="./clock-dev.ts"></script>
  </body>
</html>
